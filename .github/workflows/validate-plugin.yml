name: 插件审核
on:
  pull_request:
    paths:
      - plugins.json
      - plugins/**
  push:
    branches:
      - main
    paths:
      - plugins.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证 plugins.json
        run: |
          python3 -c "
import json,sys
with open('plugins.json') as f:
    d=json.load(f)
print('OK: %d plugins' % len(d.get('plugins',[])))
"
